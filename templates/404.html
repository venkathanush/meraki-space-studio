{% extends 'base.html' %}

{% block title %}Page Not Found | Meraki Space Studio{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center bg-dark text-center px-6 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-gold/5 via-transparent to-transparent" aria-hidden="true"></div>
    
    <div class="max-w-md relative z-10 reveal">
        <span class="text-gold text-xs uppercase tracking-[0.3em] font-semibold block mb-4">404 Error</span>
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-serif text-white mb-6">Space Not Found</h1>
        <p class="text-gray-400 font-light text-sm leading-relaxed mb-8">
            The architectural section or project page you are seeking does not exist or has been relocated.
        </p>
        <a href="{% url 'home' %}" class="magnetic-btn inline-block bg-gold text-black px-8 py-3 text-xs uppercase tracking-widest font-semibold hover:bg-white hover:text-black transition duration-300 shadow-xl">
            Return to Homepage
        </a>
    </div>
</section>
{% endblock %}
